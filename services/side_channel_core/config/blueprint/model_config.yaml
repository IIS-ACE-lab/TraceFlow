# services/side_channel_core/config/blueprint/model_config.yaml
# ────────────────────────────────────────────────
# GLOBAL
seed: 42
device: cuda #Build cuda_11.8.r11.8/compiler.31833905_0

# DATA
data:
  raw_dir: /data/raw
  batch_size: 128
  num_workers: 4

# MODEL
model:
  type: cnn        # can be 'cnn', 'mlp', 'transformer', etc.
  layers:
    - Conv2d:
        in_channels: 1
        out_channels: 32
        kernel_size: 3
        stride: 1
        padding: 1
        activation: relu
    - MaxPool2d:
        kernel_size: 2
    - Conv2d:
        in_channels: 32
        out_channels: 64
        kernel_size: 3
        stride: 1
        padding: 1
        activation: relu
    - MaxPool2d:
        kernel_size: 2
    - Flatten: {}
    - Linear:
        in_features: 7*7*64
        out_features: 128
        activation: relu
    - Dropout:
        p: 0.5
    - Linear:
        in_features: 128
        out_features: 10
        activation: softmax
