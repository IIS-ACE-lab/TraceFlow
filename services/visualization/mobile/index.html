<!doctype html>
<!-- services/visualization/mobile/index.html: the TraceFlow status page (services/visualization/server/status.py serves it) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TraceFlow">

  <link rel="stylesheet" href="/static/status.css">

  <header><img src="/static/icon-180.png" alt=""><h1>TraceFlow</h1></header>

</html>
